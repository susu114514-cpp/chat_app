services:
  - type: web
    name: render-chat-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false   # 在 Render 后台手动填写，不写进仓库
      # - key: ALLOWED_ORIGINS
      #   value: https://your-chat-app.onrender.com
