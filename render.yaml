services:
  - type: web
    name: render-chat-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false
      # - key: ALLOWED_ORIGINS
      #   value: https://your-chat-app.onrender.com
